<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELITE Q FREE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 20%, #0a1a3a, #05070f 70%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e8f0ff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 16px 60px;
    gap: 28px;
  }

  /* ============ АВАТАРКА ============ */
  .avatar-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin-top: 40px;
    margin-bottom: 20px;
  }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    background: linear-gradient(145deg, #7fd4ff 0%, #3fa9f5 45%, #1e7fd4 100%);
    border: 1.5px solid rgba(120, 190, 255, 0.85);
    box-shadow:
      0 0 30px rgba(60, 150, 255, 0.75),
      0 0 60px rgba(40, 120, 255, 0.4),
      inset 0 0 20px rgba(0, 0, 0, 0.4);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  /* ===== 4 КЛЯКСЫ ===== */
  .blob {
    position: absolute;
    border-radius: 50%;
    background: #0b1b45;
    opacity: 0.9;
    filter: blur(0.5px);
  }
  .blob1 { width: 150px; height: 150px; top: -55px; left: -55px; }
  .blob2 { width: 115px; height: 115px; bottom: -40px; right: -32px; background: #091634; }
  .blob3 { width: 85px;  height: 85px;  top: 45%; left: -35px; background: #0d1f4d; }
  .blob4 { width: 100px; height: 100px; top: -30px; right: -40px; background: #071229; }

  /* Текст на аве */
  .ava-text {
    position: relative;
    z-index: 3;
    text-align: center;
    color: #1A1008;
    font-weight: 900;
    letter-spacing: 1px;
    text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
    line-height: 1.05;
  }
  .ava-text .line1 { font-size: 30px; }
  .ava-text .line2 { font-size: 26px; }

  /* Самолёт — летит по аве */
  .plane {
    position: absolute;
    z-index: 4;
    width: 46px;
    height: 46px;
    top: 18px;
    left: 18px;
    animation: fly 6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(120, 190, 255, 0.95));
  }
  .plane svg { width: 100%; height: 100%; }
  @keyframes fly {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(120px, 30px) rotate(15deg); }
    50%  { transform: translate(150px, 150px) rotate(0deg); }
    75%  { transform: translate(30px, 120px) rotate(-15deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* Орбита с точками */
  .orbit {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    border: 1px dashed rgba(120, 190, 255, 0.28);
    animation: rotate 14s linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  .orbit .dot {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #cfe8ff;
    box-shadow: 0 0 12px 4px rgba(80, 170, 255, 0.95);
  }
  .orbit .dot:nth-child(1) { top: -3px;  left: 50%; transform: translateX(-50%); }
  .orbit .dot:nth-child(2) { bottom: -3px; left: 50%; transform: translateX(-50%); }
  .orbit .dot:nth-child(3) { left: -3px;  top: 50%; transform: translateY(-50%); }
  .orbit .dot:nth-child(4) { right: -3px; top: 50%; transform: translateY(-50%); }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ===== БЕЙДЖ "Спасибо вам ♥️" — НА МЕСТЕ АВЫ, ПЛАВНО ВВЕРХ-ВНИЗ ===== */
  .thanks-badge {
    position: absolute;
    bottom: -30px;
    left: 50%;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 30px;
    background: linear-gradient(145deg, rgba(30, 58, 138, 0.9), rgba(15, 37, 87, 0.95));
    border: 1.5px solid rgba(120, 190, 255, 0.7);
    box-shadow:
      0 0 18px rgba(60, 150, 255, 0.5),
      inset 0 0 10px rgba(0, 0, 0, 0.3);
    animation: bob 3.6s ease-in-out infinite;
    pointer-events: none;
    white-space: nowrap;
  }
  .thanks-badge span {
    font-size: 14px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(120, 190, 255, 0.9);
  }
  /* Сердце контурное SVG */
  .thanks-badge svg {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    filter: drop-shadow(0 0 4px rgba(255, 138, 138, 0.9));
    animation: heartbeat 1.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); }
    50%      { transform: translate(-50%, -12px); }
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.18); }
    40%      { transform: scale(1); }
    60%      { transform: scale(1.12); }
  }

  /* ============ РАМКИ ============ */
  .card {
    width: 100%;
    max-width: 420px;
    border-radius: 22px;
    padding: 22px 20px;
    background: linear-gradient(160deg, rgba(30, 58, 138, 0.35), rgba(6, 18, 57, 0.55));
    border: 1.5px solid rgba(120, 190, 255, 0.45);
    box-shadow:
      0 0 24px rgba(60, 150, 255, 0.3),
      inset 0 0 18px rgba(0, 0, 0, 0.35);
    text-align: center;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    padding: 9px 0;
    font-size: 15px;
    font-weight: 600;
    color: #dbe7ff;
  }
  .row svg { flex: 0 0 auto; }
  .row b { color: #fff; font-weight: 800; }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* Кнопки */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 12px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.4px;
    border-radius: 14px;
    border: 1.5px solid rgba(120, 190, 255, 0.65);
    background: linear-gradient(145deg, #1e3a8a, #0f2557);
    color: #fff;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.2s, background 0.2s;
    box-shadow: 0 0 16px rgba(60, 150, 255, 0.4);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 26px rgba(80, 170, 255, 0.7);
  }
  .btn:active { transform: scale(0.98); }

  /* Финальная надпись */
  .final {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    text-shadow: 0 0 14px rgba(80, 170, 255, 0.8);
    display: flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>
<body>

  <!-- ===== АВАТАРКА ===== -->
  <div class="avatar-wrap">
    <div class="orbit">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </div>

    <div class="avatar">
      <!-- 4 кляксы -->
      <div class="blob blob1"></div>
      <div class="blob blob2"></div>
      <div class="blob blob3"></div>
      <div class="blob blob4"></div>

      <!-- Самолёт (контурный SVG) — летит по аве -->
      <div class="plane">
        <svg viewBox="0 0 24 24" fill="none" stroke="#cfe8ff" stroke-width="1.4"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3.4 4.2-2.3 2.3H3l-1 2 3 1 1 3 2-1v-2.4l2.3-2.3 4.2 3.4a.5.5 0 0 0 .8-.5z"/>
        </svg>
      </div>

      <div class="ava-text">
        <div class="line1">ELITE Q</div>
        <div class="line2">FREE</div>
      </div>
    </div>

    <!-- ===== БЕЙДЖ "Спасибо вам ♥️" — НА МЕСТЕ АВЫ, ДВИЖЕТСЯ ВВЕРХ-ВНИЗ ===== -->
    <div class="thanks-badge">
      <span>Спасибо вам</span>
      <!-- Сердце контурное SVG -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#ff8a8a" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l1.7 1.7L12 21l7.1-6.6 1.7-1.7a5 5 0 0 0 0-7.1z"/>
      </svg>
    </div>
  </div>

  <!-- ===== ПЕРВАЯ РАМКА ===== -->
  <div class="card">
    <div class="row">
      <!-- телефон -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fc7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="2" width="12" height="20" rx="2.5"/>
        <line x1="11" y1="18" x2="13" y2="18"/>
      </svg>
      <span>Устройство</span>
      <span>-</span>
      <!-- бесконечность -->
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#8fc7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.2 8.5c-2 0-3.2 1.6-4.2 3.5-1 1.9-2.2 3.5-4.2 3.5a3.5 3.5 0 0 1 0-7c2 0 3.2 1.6 4.2 3.5 1 1.9 2.2 3.5 4.2 3.5a3.5 3.5 0 0 0 0-7z"/>
      </svg>
    </div>

    <div class="row">
      <!-- глобус -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fc7ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18"/>
        <path d="M12 3c2.5 2.5 3.8 5.6 3.8 9S14.5 18.5 12 21c-2.5-2.5-3.8-5.6-3.8-9S9.5 5.5 12 3z"/>
      </svg>
      <span>О СЕРВЕРАХ</span>
      <span>-</span>
      <b>МНОГО СЕРВЕРОВ</b>
    </div>

    <div class="row">
      <!-- галочка -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8fc7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <path d="M8 12.5l2.6 2.6L16.5 9"/>
      </svg>
      <b>Обходит все блокировки</b>
    </div>
  </div>

  <!-- ===== ВТОРАЯ РАМКА ===== -->
  <div class="card">
    <div class="card-title">
      <span>Для того что бы получить подписка</span>
      <!-- стрелка вниз -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8fc7ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="4" x2="12" y2="20"/>
        <polyline points="6 14 12 20 18 14"/>
      </svg>
    </div>

    <button class="btn" id="copyBtn" data-url="https://raw.githubusercontent.com/MK-l4/Mk14/refs/heads/main/EliteQ">
      <!-- копировать -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="12" height="12" rx="2"/>
        <path d="M5 15V5a2 2 0 0 1 2-2h10"/>
      </svg>
      <span id="copyText">Скопировать</span>
    </button>
  </div>

  <!-- ===== ТРЕТЬЯ РАМКА ===== -->
  <div class="card">
    <div class="card-title">Вы можете следовать за новостями</div>
    <a class="btn" href="https://t.me/FREEVPN444" target="_blank" rel="noopener">
      <!-- глаз / следить -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      Следить
    </a>
  </div>

  <!-- ===== ФИНАЛ ===== -->
  <div class="final">
    <span>Спасибо</span>
    <!-- сердце контурное -->
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ff8a8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l1.7 1.7L12 21l7.1-6.6 1.7-1.7a5 5 0 0 0 0-7.1z"/>
    </svg>
    <span>что вы с нами</span>
  </div>

<script>
  const copyBtn  = document.getElementById('copyBtn');
  const copyText = document.getElementById('copyText');

  copyBtn.addEventListener('click', async () => {
    const url = copyBtn.dataset.url;
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    copyText.textContent = 'Скопировано ✔️';
    setTimeout(() => {
      copyText.textContent = 'Скопировать';
    }, 1500);
  });
</script>

</body>
</html>

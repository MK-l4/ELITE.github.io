<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELITE Q FREE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-1:      #0E0F11;
    --bg-2:      #17181C;
    --bg-3:      #25272D;
    --row-bg:    #191B20;
    --row-sel:   #30333A;
    --btn:       #E8E9EC;
    --btn-text:  #111216;
    --text:      #FFFFFF;
    --text-dim:  #A3A6AE;
    --tint:      #C9CBD0;
    --elipse-1:  #50535A;
    --elipse-2:  #303239;
    --elipse-3:  #17181C;
    --border-thin: 1px solid rgba(255, 255, 255, 0.85);
  }

  body {
    min-height: 100vh;
    background: linear-gradient(25deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 60px 16px 60px;
    gap: 28px;
  }

  /* ============ АВАТАРКА ============ */
  .avatar-wrap {
    position: relative;
    width: 240px;
    height: 240px;
    margin-top: 40px;
    margin-bottom: 20px;
  }

  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 32px;
    background: linear-gradient(25deg, #50535A 0%, #303239 45%, #17181C 100%);
    border: 1.5px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 0 22px rgba(255, 255, 255, 0.18), 0 0 50px rgba(120, 125, 135, 0.25), inset 0 0 20px rgba(0, 0, 0, 0.55);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.9;
    filter: blur(0.5px);
  }
  .blob1 { width: 150px; height: 150px; top: -55px; left: -55px; background: var(--elipse-1); }
  .blob2 { width: 115px; height: 115px; bottom: -40px; right: -32px; background: var(--elipse-3); }
  .blob3 { width: 85px; height: 85px; top: 45%; left: -35px; background: var(--elipse-2); }
  .blob4 { width: 100px; height: 100px; top: -30px; right: -40px; background: var(--elipse-3); }

  .ava-text {
    position: relative;
    z-index: 3;
    text-align: center;
    color: var(--text);
    font-weight: 900;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7), 0 0 18px rgba(255, 255, 255, 0.35);
    line-height: 1.05;
  }
  .ava-text .line1 { font-size: 44px; }

  .plane {
    position: absolute;
    z-index: 4;
    width: 46px;
    height: 46px;
    top: 18px;
    left: 18px;
    animation: fly 6s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.85));
  }
  .plane svg { width: 100%; height: 100%; }
  @keyframes fly {
    0%   { transform: translate(0, 0) rotate(0deg); }
    25%  { transform: translate(120px, 30px) rotate(15deg); }
    50%  { transform: translate(150px, 150px) rotate(0deg); }
    75%  { transform: translate(30px, 120px) rotate(-15deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  .orbit {
    position: absolute;
    inset: -22px;
    border-radius: 50%;
    border: 1px dashed rgba(255, 255, 255, 0.35);
    animation: rotate 14s linear infinite;
    z-index: 1;
    pointer-events: none;
  }
  .orbit .dot {
    position: absolute;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffffff;
    box-shadow: 0 0 12px 4px rgba(255, 255, 255, 0.85);
  }
  .orbit .dot:nth-child(1) { top: -3px; left: 50%; transform: translateX(-50%); }
  .orbit .dot:nth-child(2) { bottom: -3px; left: 50%; transform: translateX(-50%); }
  .orbit .dot:nth-child(3) { left: -3px; top: 50%; transform: translateY(-50%); }
  .orbit .dot:nth-child(4) { right: -3px; top: 50%; transform: translateY(-50%); }
  @keyframes rotate {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ===== БЕЙДЖ ===== */
  .thanks-badge {
    position: absolute;
    bottom: -30px;
    left: 50%;
    z-index: 6;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 18px;
    border-radius: 30px;
    background: linear-gradient(145deg, var(--row-sel), var(--row-bg));
    border: var(--border-thin);
    box-shadow: 0 0 18px rgba(255, 255, 255, 0.18), inset 0 0 10px rgba(0, 0, 0, 0.5);
    animation: bob 3.6s ease-in-out infinite;
    pointer-events: none;
    white-space: nowrap;
  }
  .thanks-badge span {
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
    letter-spacing: 0.5px;
    text-shadow: 0 0 8px rgba(255, 255, 255, 0.5);
  }
  .thanks-badge svg {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    filter: drop-shadow(0 0 4px rgba(255, 138, 138, 0.9));
    animation: heartbeat 1.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translate(-50%, 0); }
    50%      { transform: translate(-50%, -12px); }
  }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    25%      { transform: scale(1.18); }
    40%      { transform: scale(1); }
    60%      { transform: scale(1.12); }
  }

  /* ============ КАРТОЧКИ ============ */
  .card {
    width: 100%;
    max-width: 420px;
    border-radius: 22px;
    padding: 22px 20px;
    background: linear-gradient(160deg, var(--row-sel), var(--row-bg));
    border: var(--border-thin);
    box-shadow: 0 0 22px rgba(255, 255, 255, 0.12), inset 0 0 18px rgba(0, 0, 0, 0.45);
    text-align: center;
  }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    padding: 9px 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-dim);
  }
  .row svg { flex: 0 0 auto; }
  .row b { color: var(--text); font-weight: 800; }

  .card-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  /* Кнопки */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    width: 100%;
    margin-top: 12px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.4px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.9);
    background: linear-gradient(145deg, #F2F3F5, var(--btn));
    color: var(--btn-text);
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.15s, box-shadow 0.2s, filter 0.2s;
    box-shadow: 0 0 16px rgba(232, 233, 236, 0.25);
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 26px rgba(255, 255, 255, 0.6);
    filter: brightness(1.05);
  }
  .btn:active { transform: scale(0.98); }

  .btn svg { stroke: var(--btn-text) !important; }

  .final {
    margin-top: 10px;
    font-size: 20px;
    font-weight: 800;
    color: var(--text);
    text-shadow: 0 0 14px rgba(255, 255, 255, 0.5);
    display: flex;
    align-items: center;
    gap: 10px;
  }
</style>
</head>

<script>
  const copyBtn  = document.getElementById('copyBtn');
  const copyText = document.getElementById('copyText');

  copyBtn.addEventListener('click', async () => {
    const url = copyBtn.dataset.url;
    try {
      await navigator.clipboard.writeText(url);
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = url;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
    }
    copyText.textContent = 'Скопировано ✔️';
    setTimeout(() => {
      copyText.textContent = 'Скопировать';
    }, 1500);
  });
